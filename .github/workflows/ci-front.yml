name: CI (front)

on:
  push:
    branches: [master]
    paths: ["front/**", ".github/workflows/ci-front.yml"]
  pull_request:
    branches: [master]
    paths: ["front/**", ".github/workflows/ci-front.yml"]

defaults:
  run:
    working-directory: front

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test-coverage
