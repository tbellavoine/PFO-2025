<div class="flex flex-col gap-6 max-w-2xl">
  <h2 class="text-2xl text-light font-semibold">Profil</h2>

  <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
    <label class="flex flex-col gap-1 text-sm text-light/60">
      Nom
      <input type="text" [formField]="profileForm.name" class="rounded border border-light/20 bg-transparent p-2 text-light" />
    </label>

    <label class="flex flex-col gap-1 text-sm text-light/60">
      Titre
      <input type="text" [formField]="profileForm.title" class="rounded border border-light/20 bg-transparent p-2 text-light" />
    </label>

    <label class="flex flex-col gap-1 text-sm text-light/60">
      URL du CV
      <input type="text" [formField]="profileForm.cvUrl" class="rounded border border-light/20 bg-transparent p-2 text-light" />
    </label>

    <div class="flex flex-col gap-2">
      <p class="text-sm text-light/60">Biographie (paragraphes HTML)</p>
      @for (paragraph of bioParagraphs(); track $index) {
        <div class="flex gap-2">
          <textarea rows="2" [value]="paragraph" (input)="updateBioParagraph($index, $any($event.target).value)"
                    class="flex-1 rounded border border-light/20 bg-transparent p-2 text-light"></textarea>
          <button type="button" (click)="removeBioParagraph($index)" class="text-light/40 hover:text-red-500">✕</button>
        </div>
      }
      <button type="button" (click)="addBioParagraph()" class="w-fit text-sm text-accent hover:underline">+ Ajouter un paragraphe</button>
    </div>

    <div class="flex flex-col gap-2">
      <p class="text-sm text-light/60">Savoir-être</p>
      @for (skill of softSkills(); track $index) {
        <div class="flex gap-2">
          <input type="text" [value]="skill" (input)="updateSoftSkill($index, $any($event.target).value)"
                 class="flex-1 rounded border border-light/20 bg-transparent p-2 text-light" />
          <button type="button" (click)="removeSoftSkill($index)" class="text-light/40 hover:text-red-500">✕</button>
        </div>
      }
      <button type="button" (click)="addSoftSkill()" class="w-fit text-sm text-accent hover:underline">+ Ajouter une compétence</button>
    </div>

    @if (statusMessage(); as message) {
      <p class="text-sm text-accent">{{ message }}</p>
    }

    <button type="submit" [disabled]="saving()" class="w-fit rounded bg-accent px-4 py-2 text-light disabled:opacity-50">
      {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </form>
</div>
